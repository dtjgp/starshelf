// ------------------------------------------------------------------ AI assistant (chat drawer)
// Each turn sends the conversation and the current draft; the AI answers with a reply and a list
// of operations, which are applied to the draft as one undoable edit. Nothing here writes to GitHub.
const CHAT_KEY = "sl-chat";
const CHAT = { open: false, turns: [], waiting: null, waitingLabel: "", poll: null };
const CHAT_EXAMPLES = ["把量化、金融相关的仓库都移到 Finance", "FunProjects 太杂了，按主题拆成几个列表",
  "哪些仓库还不在任何列表里？帮我归类", "把 EdgeAI 改名为「🔬 EdgeAI & Compression」"];
const chatKeep = t => ({ role: t.role, text: t.text, ops: t.ops, warnings: t.warnings, label: t.label, undone: t.undone });
function loadChat() {
  try {
    const o = JSON.parse(localStorage.getItem(CHAT_KEY) || "null");
    CHAT.turns = o && o.fetchedAt === S.fetchedAt && Array.isArray(o.turns) ? o.turns.map(chatKeep) : [];
  } catch (_) { CHAT.turns = []; }
}
function saveChat() {
  try { localStorage.setItem(CHAT_KEY, JSON.stringify({ fetchedAt: S.fetchedAt, turns: CHAT.turns.slice(-40).map(chatKeep) })); } catch (_) {}
}

async function toggleChat(open) {
  CHAT.open = open === undefined ? !CHAT.open : open;
  $("#app").classList.toggle("chat-open", CHAT.open);
  $("#btnChat").classList.toggle("on", CHAT.open);
  if (!CHAT.open) return;
  renderChat();
  $("#chatInput").focus();
  if (!AI.status) {
    try { const j = await api("GET", "/api/suggest"); if (j.ai) AI.status = j.ai; } catch (_) {}
    renderChat();
  }
}

function chatBackend() {
  const backends = (AI.status && AI.status.backends) || [];
  if (!backends.some(b => b.id === AI.form.backend)) {
    const saved = rememberedBackend();
    const pick = backends.find(b => b.id === saved && b.available) || backends.find(b => b.id === (AI.status || {}).default);
    AI.form.backend = pick ? pick.id : null;
  }
  return { backends, st: backends.find(b => b.id === AI.form.backend) || null };
}

function renderChat() {
  if (!CHAT.open) return;
  const { backends, st } = chatBackend();
  const sel = $("#chatBackend");
  sel.replaceChildren(...backends.map(b => h("option", { value: b.id, selected: b.id === AI.form.backend }, b.label + (b.available ? "" : "（不可用）"))));
  sel.hidden = !backends.length;
  const note = $("#chatNote");
  note.replaceChildren();
  if (!AI.status) note.append("正在检查 AI 设置…");
  else if (!st || !st.available) note.append(h("div", { class: "warn" }, h("b", {}, "AI 还不能用："), (st && st.reason) || "没有可用的 AI 选项。",
    st && (st.setup || []).length ? h("pre", { class: "setup" }, st.setup.join("\n")) : null));
  else if (st.warning) note.append(h("div", { class: "warn" }, h("b", {}, "安全提示："), st.warning));
  const log = $("#chatLog");
  log.replaceChildren();
  if (!CHAT.turns.length && !CHAT.waiting) {
    log.append(h("div", { class: "chat-empty" }, "告诉 AI 你想怎么整理，例如：",
      h("ul", {}, CHAT_EXAMPLES.map(e => h("li", {}, h("button", { class: "link", onclick: () => { $("#chatInput").value = e; $("#chatInput").focus(); } }, e)))),
      "AI 的修改只进入草稿，每一步都可以撤销；写入 GitHub 仍需「预览修改」。"));
  }
  CHAT.turns.forEach((t, i) => log.append(turnEl(t, i)));
  if (CHAT.waiting) log.append(h("div", { class: "msg ai pending", id: "chatPending" }, `${CHAT.waitingLabel || "AI"} 正在思考…`));
  log.scrollTop = log.scrollHeight;
  $("#chatSend").disabled = !!CHAT.waiting || !st || !st.available;
}

function turnEl(t) {
  if (t.role === "user") return h("div", { class: "msg me" }, t.text);
  if (t.role === "err") return h("div", { class: "msg ai err" }, t.text);
  const canUndo = !!t.after && !t.undone && snapState() === t.after;
  return h("div", { class: "msg ai" }, t.text,
    (t.ops || []).length ? h("ul", { class: "done" }, t.ops.map(o => h("li", {}, o))) : null,
    (t.warnings || []).length ? h("ul", { class: "skipped" }, t.warnings.map(w => h("li", {}, w))) : null,
    (t.ops || []).length ? h("div", { class: "turn-foot" }, h("span", {}, t.undone ? "已撤销这一步" : "已写入草稿（还没有写入 GitHub）"),
      t.undone ? null : h("button", { class: "link undo-turn", disabled: !canUndo,
        title: canUndo ? "撤销 AI 这一步对草稿的修改" : "之后草稿又改过；请用顶部的「撤销」逐步撤回",
        onclick: () => undoTurn(t) }, "撤销这一步")) : null);
}

function undoTurn(t) {
  if (!t.after || snapState() !== t.after) return;
  commit(() => loadState(t.before));
  t.undone = true;
  saveChat(); renderChat();
  toast("已撤销 AI 助手的这一步", false);
}

async function sendChat() {
  const input = $("#chatInput");
  const text = input.value.trim();
  if (!text || CHAT.waiting) return;
  const history = CHAT.turns.filter(t => t.role !== "err").slice(-12).map(t => ({
    role: t.role === "user" ? "user" : "assistant",
    text: t.role === "ai" && (t.ops || []).length ? `${t.text}\n（已改草稿：${t.ops.join("；")}${t.undone ? "；随后被撤销" : ""}）` : t.text,
  }));
  const body = { message: text, history, backend: AI.form.backend, unstar: [...S.unstar],
    lists: alive().map(l => ({ key: l.key, name: l.name.trim(), description: l.description, items: [...l.items] })) };
  CHAT.turns.push({ role: "user", text });
  input.value = "";
  saveChat();
  try {
    const j = await api("POST", "/api/chat", body);
    CHAT.waiting = j.id; CHAT.waitingLabel = j.label;
    renderChat(); pollChat();
  } catch (err) {
    CHAT.turns.push({ role: "err", text: err.message });
    saveChat(); renderChat();
  }
}

function pollChat() {
  clearInterval(CHAT.poll);
  CHAT.poll = setInterval(async () => {
    let j;
    try { j = await api("GET", "/api/chat"); } catch (_) { return; }
    if (j.id !== CHAT.waiting) { clearInterval(CHAT.poll); return; }
    if (j.status === "running") {
      const el = $("#chatPending");
      if (el) el.textContent = `${j.label || "AI"} 正在思考…（${Math.round(j.elapsed)} 秒）`;
      return;
    }
    clearInterval(CHAT.poll); CHAT.waiting = null;
    if (j.ai) AI.status = j.ai;
    if (j.status === "done") finishChat(j.result, j.label);
    else { CHAT.turns.push({ role: "err", text: j.error || "出现了未知错误。" }); saveChat(); renderChat(); }
  }, 1000);
}

// Apply one answer's operations to the draft (runs inside commit()); returns what was done.
function applyChatOps(ops) {
  const done = [], skipped = [], made = {};
  const nameOf = id => (S.repos.get(id) || {}).full_name || id;
  const few = ids => ids.length <= 3 ? ids.map(nameOf).join("、") : `${ids.slice(0, 2).map(nameOf).join("、")} 等 ${ids.length} 个仓库`;
  const target = ref => {
    const key = ref && ref.startsWith("new:") ? made[ref] : ref;
    const l = key ? findList(key) : null;
    return l && !l.deleted ? l : null;
  };
  const clash = (name, except) => alive().find(x => x !== except && x.name.toLowerCase() === name.toLowerCase());
  for (const o of ops) {
    const ids = (o.repos || []).filter(id => S.repos.has(id));
    if (o.op === "create_list") {
      const twin = clash(o.name);
      if (twin) { made[o.list] = twin.key; skipped.push(`已经有「${twin.name}」，没有重复新建`); continue; }
      const key = `new-${S.newSeq++}`;
      S.lists.push({ key, id: null, name: o.name, description: o.description || "", private: false, items: new Set(), deleted: false, color: nextColor() });
      made[o.list] = key;
      done.push(`新建列表「${o.name}」`);
      continue;
    }
    if (o.op === "unstar") {
      const ok = ids.filter(id => S.repos.get(id).starred && !S.unstar.has(id));
      if (ok.length) { clearRaw(ok); ok.forEach(id => S.unstar.add(id)); done.push(`标记取消 star：${few(ok)}`); }
      continue;
    }
    if (o.op === "keep_star") {
      const ok = ids.filter(id => S.unstar.has(id));
      ok.forEach(id => {
        S.unstar.delete(id);
        for (const l of alive()) { const b = S.base.get(l.key); if (b && b.items.has(id)) l.items.add(id); }
      });
      if (ok.length) done.push(`保留 star：${few(ok)}`);
      continue;
    }
    const l = target(o.list);
    if (!l) { skipped.push("有一步要操作的列表已经不存在，跳过了"); continue; }
    if (o.op === "rename_list") {
      if (clash(o.name, l)) { skipped.push(`已经有叫「${o.name}」的列表，没有改名`); continue; }
      const old = l.name;
      l.name = o.name;
      if (o.description) l.description = o.description;
      if (old !== o.name) done.push(`把「${old}」改名为「${o.name}」`);
    } else if (o.op === "delete_list") {
      if (!l.id) S.lists.splice(S.lists.indexOf(l), 1); else l.deleted = true;
      done.push(`删除列表「${l.name}」（其中的仓库仍保持 star）`);
    } else if (o.op === "add") {
      const n = ids.filter(id => !l.items.has(id));
      n.forEach(id => { l.items.add(id); S.unstar.delete(id); });
      if (n.length) done.push(`把 ${few(n)} 加入「${l.name}」`);
    } else if (o.op === "remove") {
      const n = ids.filter(id => l.items.has(id));
      n.forEach(id => l.items.delete(id));
      if (n.length) done.push(`把 ${few(n)} 移出「${l.name}」`);
    } else if (o.op === "move") {
      const to = target(o.to);
      if (!to) { skipped.push("有一步要移入的列表已经不存在，跳过了"); continue; }
      ids.forEach(id => { l.items.delete(id); to.items.add(id); S.unstar.delete(id); });
      if (ids.length) done.push(`把 ${few(ids)} 从「${l.name}」移到「${to.name}」`);
    }
  }
  return { done, skipped };
}

function finishChat(res, label) {
  const before = snapState();
  let out = { done: [], skipped: [] };
  const changed = commit(() => { out = applyChatOps(res.operations || []); });
  S.lists.filter(l => !l.id && !l.deleted).forEach(l => rememberColor(l));
  CHAT.turns.push({ role: "ai", label, text: res.reply || (changed ? "已按你的要求修改了草稿。" : "草稿不需要修改。"),
    ops: changed ? out.done : [], warnings: [...(res.warnings || []), ...out.skipped],
    before: changed ? before : null, after: changed ? snapState() : null });
  saveChat(); renderChat();
  if (changed) toast(`AI 助手修改了草稿（${out.done.length} 处）`);
}

function toggleSel(id, shift) {
  const vis = S.visible;
  if (shift && S.anchor && vis.includes(S.anchor)) {
    const a = vis.indexOf(S.anchor), b = vis.indexOf(id);
    const on = !S.sel.has(id);
    for (let i = Math.min(a, b); i <= Math.max(a, b); i++) on ? S.sel.add(vis[i]) : S.sel.delete(vis[i]);
  } else {
    S.sel.has(id) ? S.sel.delete(id) : S.sel.add(id);
  }
  S.anchor = id;
  renderSelection();
}
$("#rows").addEventListener("click", e => {
  const row = e.target.closest(".row"); if (!row) return;
  const id = row.dataset.id;
  if (e.target.closest("a")) return;
  const act = e.target.closest("[data-act]");
  const name = act && act.dataset.act;
  if (name === "pick") { toggleSel(id, e.shiftKey); return; }
  if (name === "goto") { setView(act.dataset.key); return; }
  if (name === "chip-remove") { doRemove(act.dataset.key, [id]); return; }
  if (name === "chip-restore") { doAdd(act.dataset.key, [id]); return; }
  if (name === "restore-here") { doAdd(S.view, [id]); return; }
  if (name === "keep-star") { doKeepStar([id]); return; }
  if (name === "pick-lists") { openPicker(act, { mode: "toggle", ids: [id], title: "放进哪些列表" }); return; }
  if (e.target.closest("button, input, select, label")) return;
  if (window.getSelection && String(window.getSelection())) return;   // user is selecting text
  toggleSel(id, e.shiftKey);
});

const side = $(".side");
side.addEventListener("dragover", e => {
  if (!S.drag) return;
  const t = dropTarget(e);
  document.querySelectorAll(".drop").forEach(x => x !== t && x.classList.remove("drop"));
  if (!t) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = (e.altKey && viewList()) || t.classList.contains("vbtn") ? "move" : "copy";
  t.classList.add("drop");
});
side.addEventListener("drop", e => {
  if (!S.drag) return;
  const t = dropTarget(e); if (!t) return;
  e.preventDefault();
  const ids = S.drag.ids;
  t.classList.remove("drop");
  if (t.classList.contains("vbtn")) { doClear(ids); return; }
  const key = t.dataset.key, cur = viewList();
  if (e.altKey && cur && !cur.deleted && cur.key !== key) { S.sel.clear(); doMove(cur.key, key, ids); }
  else doAdd(key, ids);
});

document.addEventListener("keydown", e => {
  const mod = e.metaKey || e.ctrlKey;
  if (e.key === "Escape") {
    if (pop) { e.preventDefault(); closePopover(); return; }
    if (!document.querySelector("dialog[open]") && S.sel.size) { S.sel.clear(); renderSelection(); }
    return;
  }
  if (document.querySelector("dialog[open]")) return;
  if (isTyping()) return;
  if (e.key === "/" && !mod) { e.preventDefault(); $("#q").focus(); $("#q").select(); }
  else if (mod && e.key.toLowerCase() === "z" && !e.shiftKey) { e.preventDefault(); undo(); }
  else if ((mod && e.key.toLowerCase() === "z" && e.shiftKey) || (e.ctrlKey && e.key.toLowerCase() === "y")) { e.preventDefault(); redo(); }
  else if (mod && e.key.toLowerCase() === "a") { e.preventDefault(); S.visible.forEach(id => S.sel.add(id)); renderSelection(); }
});

// ------------------------------------------------------------------ boot
async function boot() {
  const msg = $("#bootMsg"), retry = $("#bootRetry");
  if (!TOKEN) {
    msg.textContent = "请用启动时终端里显示的完整链接打开这个页面（链接末尾带有 #t=…）。";
    document.querySelector("#boot .star").classList.remove("spin");
    return;
  }
  retry.hidden = true;
  msg.textContent = "正在从 GitHub 读取你的 star 和列表…";
  try {
    const d = await api("GET", "/api/state");
    setBaseline(d.baseline);
    if (d.draft && Array.isArray(d.draft.lists)) {
      loadLists(d.draft.lists);
      loadUnstar(d.draft.unstar);
      S.newSeq = d.draft.newSeq || S.lists.length + 1;
    }
    loadChat();
    $("#boot").hidden = true;
    $("#app").hidden = false;
    render();
    if (d.draft && summary().total) { $("#saveState").textContent = "草稿已自动保存"; toast(`已恢复上次未应用的 ${summary().total} 处修改`, false); }
    if (d.job && d.job.status === "running") {
      S.job = d.job; S.review = { restore: null };
      renderTop(); $("#reviewDialog").showModal(); renderProgress(d.job); startPolling();
    }
  } catch (err) {
    msg.textContent = "读取失败：" + err.message;
    document.querySelector("#boot .star").classList.remove("spin");
    retry.hidden = false;
  }
}
$("#bootRetry").addEventListener("click", boot);
boot();
})();
</script>

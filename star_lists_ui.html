<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Starshelf</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23C48A12' d='M12 2.6l2.83 6.08 6.67.72-4.98 4.5 1.4 6.56L12 17.1l-5.92 3.36 1.4-6.56-4.98-4.5 6.67-.72z'/%3E%3C/svg%3E">
<style>
:root {
  --paper: #EDF0F4;
  --panel: #FFFFFF;
  --sunk: #F5F7FA;
  --ink: #1B2333;
  --ink-2: #566175;
  --ink-3: #8691A4;
  --rule: #D9DFE7;
  --rule-2: #E8ECF1;
  --gold: #B47E0E;
  --gold-soft: #F7E9C8;
  --add: #1D8669;
  --remove: #B0453D;
  --focus: #3A5FD9;
  --sel: #E7ECFA;
  --shadow: 0 14px 36px rgba(18, 28, 48, .18), 0 2px 6px rgba(18, 28, 48, .08);
  --font: "Avenir Next", "Avenir", "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", "Microsoft YaHei", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #111722;
    --panel: #171F2D;
    --sunk: #131A26;
    --ink: #E4E8F0;
    --ink-2: #A3ADBF;
    --ink-3: #75809A;
    --rule: #29334499;
    --rule-2: #212A3A;
    --gold: #E2B048;
    --gold-soft: #3A301C;
    --add: #4CC09E;
    --remove: #E57E74;
    --focus: #84A1FF;
    --sel: #20304F;
    --shadow: 0 14px 36px rgba(0, 0, 0, .55);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font: 14px/1.45 var(--font);
  background: var(--paper);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
button {
  cursor: pointer;
  border: 1px solid var(--rule);
  background: var(--panel);
  border-radius: 6px;
  padding: 5px 11px;
  line-height: 1.3;
  white-space: nowrap;
}
button:hover:not(:disabled) { border-color: var(--ink-3); }
button:disabled { opacity: .42; cursor: default; }
button.primary { background: var(--ink); border-color: var(--ink); color: var(--panel); font-weight: 600; }
button.primary:hover:not(:disabled) { border-color: var(--ink); filter: brightness(1.15); }
button.ghost { border-color: transparent; background: transparent; }
button.ghost:hover:not(:disabled) { background: var(--sunk); border-color: transparent; }
button.danger { color: var(--remove); }
button.link { border: 0; background: none; padding: 0; color: var(--focus); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
input[type=checkbox] { width: 15px; height: 15px; accent-color: var(--focus); margin: 0; }
.muted { color: var(--ink-2); }
.small { font-size: 12.5px; }
.star path { fill: var(--c, var(--gold)); }
[hidden] { display: none !important; }

/* ---------- boot ---------- */
.boot { height: 100%; display: grid; place-items: center; text-align: center; padding: 24px; }
.boot .star { width: 40px; height: 40px; }
.boot p { color: var(--ink-2); max-width: 46ch; }
.boot .spin { animation: turn 2.4s linear infinite; }
@keyframes turn { to { transform: rotate(360deg); } }

/* ---------- frame ---------- */
.app {
  display: grid;
  grid-template-columns: 300px minmax(0, 1fr);
  grid-template-rows: auto minmax(0, 1fr);
  height: 100vh;
}
.top {
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 10px 16px 10px 20px;
  min-height: 56px;
  background: var(--panel);
  border-bottom: 1px solid var(--rule);
}
.brand { display: flex; align-items: center; gap: 9px; font-weight: 600; font-size: 16px; letter-spacing: -.005em; }
.brand .star { width: 20px; height: 20px; }
.who { display: flex; flex-direction: column; line-height: 1.25; }
.who b { font-weight: 600; }
.top-actions { margin-left: auto; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.save-state { font-size: 12.5px; color: var(--ink-3); margin-right: 6px; }
.ui-lang { font-size: 12.5px; padding: 4px 6px; border-color: transparent; background: transparent; color: var(--ink-2); }
.ui-lang:hover { border-color: var(--rule); }
.count {
  display: inline-block; min-width: 1.7em; margin-left: 7px; padding: 0 6px;
  border-radius: 9px; background: var(--gold-soft); color: var(--gold);
  font-size: 12px; font-variant-numeric: tabular-nums; text-align: center;
}

/* ---------- sidebar ---------- */
.side { overflow: auto; padding: 14px 12px 28px; }
.side nav { display: flex; flex-direction: column; gap: 2px; margin-bottom: 18px; }
.vbtn, .lbtn {
  display: flex; align-items: center; gap: 10px; width: 100%;
  text-align: left; border: 0; background: transparent;
  padding: 7px 10px; border-radius: 7px; min-width: 0;
}
.vbtn:hover, .lbtn:hover { background: color-mix(in srgb, var(--panel) 60%, transparent); }
.vbtn.on, .litem.on .lbtn { background: var(--panel); box-shadow: 0 0 0 1px var(--rule); font-weight: 600; }
.n { margin-left: auto; color: var(--ink-3); font-variant-numeric: tabular-nums; font-size: 13px; font-weight: 400; }
.side-head { display: flex; align-items: center; justify-content: space-between; padding: 0 4px 6px 10px; }
.side-head h2 { margin: 0; font-size: 13px; font-weight: 600; color: var(--ink-2); }
.lists { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.litem { display: flex; align-items: center; border-radius: 7px; position: relative; }
.litem .lbtn { flex: 1; }
.litem .star { width: 14px; height: 14px; flex: none; }
.lname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.litem .edit {
  position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
  opacity: 0; padding: 2px 9px; font-size: 12px;
  background: var(--panel); border: 1px solid var(--rule);
}
.litem:hover .edit, .litem .edit:focus-visible, .litem.doomed .edit { opacity: 1; }
.litem:hover .n, .litem:focus-within .n, .litem.doomed .n { visibility: hidden; }
.litem.doomed .lname { text-decoration: line-through; color: var(--ink-3); }
.litem.drop .lbtn, .vbtn.drop { background: color-mix(in srgb, var(--c, var(--focus)) 16%, var(--panel)); box-shadow: 0 0 0 1.5px var(--c, var(--focus)); }
.flag { width: 6px; height: 6px; border-radius: 50%; background: var(--gold); flex: none; }
.badge { font-size: 11px; line-height: 17px; padding: 0 6px; border-radius: 4px; background: var(--gold-soft); color: var(--gold); font-weight: 600; flex: none; }
.badge.del { background: color-mix(in srgb, var(--remove) 14%, var(--panel)); color: var(--remove); }
.hint { margin: 14px 10px 0; font-size: 12.5px; color: var(--ink-2); }
.empty-side { padding: 6px 10px; color: var(--ink-3); font-size: 13px; }

/* ---------- main ---------- */
.main { overflow: auto; background: var(--panel); border-left: 1px solid var(--rule); }
.sticky { position: sticky; top: 0; z-index: 3; background: var(--panel); border-bottom: 1px solid var(--rule); }
.view-head { display: flex; align-items: flex-start; gap: 16px; padding: 22px 24px 8px; }
.view-head .titles { min-width: 0; flex: 1; }
.view-head h1 { margin: 0; font-size: 24px; line-height: 1.2; font-weight: 600; letter-spacing: -.012em; display: flex; align-items: center; gap: 11px; flex-wrap: wrap; }
.view-head h1 .star { width: 22px; height: 22px; }
.view-head p { margin: 5px 0 0; color: var(--ink-2); max-width: 46em; }
.banner { margin: 8px 24px 4px; padding: 9px 12px; border-radius: 8px; background: color-mix(in srgb, var(--remove) 9%, var(--panel)); color: var(--ink); display: flex; gap: 12px; align-items: center; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 24px 12px; }
.search { position: relative; flex: 1 1 240px; max-width: 420px; }
.search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; stroke: var(--ink-3); fill: none; stroke-width: 2; }
.search input { width: 100%; padding: 7px 30px 7px 32px; border: 1px solid var(--rule); border-radius: 8px; background: var(--sunk); }
.search input:not(:placeholder-shown) + kbd { display: none; }
.search kbd { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); font: 12px var(--font); color: var(--ink-3); border: 1px solid var(--rule); border-radius: 4px; padding: 0 5px; }
select { padding: 6px 8px; border: 1px solid var(--rule); border-radius: 8px; background: var(--panel); }
.toggle { display: inline-flex; align-items: center; gap: 7px; padding: 6px 10px; border: 1px solid var(--rule); border-radius: 8px; cursor: pointer; user-select: none; }
.listhead { display: flex; align-items: center; gap: 10px; padding: 7px 24px; min-height: 42px; border-top: 1px solid var(--rule-2); font-size: 13px; color: var(--ink-2); flex-wrap: wrap; }
.listhead.has-sel { background: var(--sel); color: var(--ink); }
.listhead .acts { display: flex; gap: 6px; flex-wrap: wrap; }
.listhead .acts button { padding: 4px 10px; font-size: 13px; }

.rows { padding-bottom: 80px; }
.row {
  display: grid;
  grid-template-columns: 24px minmax(0, 1fr) 128px minmax(190px, 32%);
  gap: 14px; align-items: start;
  padding: 11px 24px; border-bottom: 1px solid var(--rule-2);
  position: relative; cursor: default;
}
.row:hover { background: var(--sunk); }
.row.sel { background: var(--sel); }
.row.changed::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--gold); }
.row.gone .what, .row.gone .meta { opacity: .5; }
.row.unstarring::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--remove); }
.row.unstarring .name .repo { text-decoration: line-through; text-decoration-color: var(--remove); }
.tag.del { color: var(--remove); border-color: color-mix(in srgb, var(--remove) 45%, var(--rule)); }
.unstar-note { margin: 4px 0 0; font-size: 12.5px; color: var(--remove); display: flex; gap: 10px; align-items: center; }
.opt.danger { color: var(--remove); }
.confirm-unstar { margin-top: 12px; padding: 10px 12px; border-radius: 8px; border: 1px solid color-mix(in srgb, var(--remove) 45%, var(--rule)); align-items: flex-start; }
.confirm-unstar input { margin-top: 3px; }
.row > input { margin-top: 3px; }
.what { min-width: 0; }
.name { color: var(--ink); text-decoration: none; font-weight: 600; font-size: 14.5px; overflow-wrap: anywhere; }
.name .owner { font-weight: 400; color: var(--ink-2); }
.name:hover .repo { text-decoration: underline; text-underline-offset: 2px; }
.tag { display: inline-block; margin-left: 8px; font-size: 11.5px; padding: 0 6px; border-radius: 4px; border: 1px solid var(--rule); color: var(--ink-2); vertical-align: 1px; }
.desc { margin: 3px 0 0; color: var(--ink-2); font-size: 13px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.gone-note { margin: 4px 0 0; font-size: 12.5px; color: var(--remove); display: flex; gap: 10px; align-items: center; }
.meta { font-size: 12.5px; color: var(--ink-2); display: flex; flex-direction: column; gap: 1px; font-variant-numeric: tabular-nums; padding-top: 2px; }
.meta .stars { color: var(--ink); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; padding-top: 1px; align-items: center; }
.chip {
  display: inline-flex; align-items: center; height: 23px; max-width: 100%;
  border-radius: 12px; font-size: 12px; white-space: nowrap;
  background: color-mix(in srgb, var(--c) 13%, var(--panel));
  color: color-mix(in srgb, var(--c) 58%, var(--ink));
  border: 1px solid color-mix(in srgb, var(--c) 32%, transparent);
}
.chip button { border: 0; background: transparent; height: 100%; color: inherit; font-size: 12px; border-radius: 12px; }
.chip .cn { padding: 0 3px 0 9px; max-width: 170px; overflow: hidden; text-overflow: ellipsis; }
.chip .x { padding: 0 8px 0 4px; opacity: .55; font-size: 13px; }
.chip .x:hover { opacity: 1; }
.chip.added { box-shadow: 0 0 0 1.5px var(--gold); }
.chip.removed, .chip.doomed {
  background: transparent; border: 1px dashed var(--rule); color: var(--ink-3);
  text-decoration: line-through; padding: 0 9px;
}
.chip.removed { cursor: pointer; }
.chip.removed:hover { color: var(--ink); border-color: var(--ink-3); }
.chip-add { height: 23px; width: 28px; padding: 0; border-radius: 12px; border: 1px dashed var(--ink-3); background: transparent; color: var(--ink-2); font-size: 15px; line-height: 1; }
.empty { padding: 56px 24px; text-align: center; color: var(--ink-2); }
.empty .star { width: 28px; height: 28px; opacity: .6; }
.empty p { max-width: 50ch; margin: 10px auto 0; }

/* ---------- popover ---------- */
.popover {
  position: fixed; z-index: 50; width: 292px; max-height: min(440px, 72vh);
  display: flex; flex-direction: column;
  background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; box-shadow: var(--shadow);
}
.popover .ph { padding: 11px 12px 7px; font-weight: 600; font-size: 13px; }
.popover input[type=search] { margin: 0 10px 6px; padding: 6px 9px; border: 1px solid var(--rule); border-radius: 7px; background: var(--sunk); }
.popover .opts { overflow: auto; padding: 2px 6px 6px; }
.opt { display: flex; gap: 10px; align-items: center; width: 100%; border: 0; background: transparent; padding: 7px 8px; border-radius: 6px; text-align: left; }
.opt:hover, .opt:focus-visible { background: var(--sunk); }
.opt .star { width: 13px; height: 13px; flex: none; }
.opt .on { margin-left: auto; color: var(--add); font-weight: 700; }
.opt .n { margin-left: auto; }
.popover .pf { border-top: 1px solid var(--rule-2); padding: 5px 6px; }

/* ---------- dialogs ---------- */
dialog {
  border: 1px solid var(--rule); border-radius: 12px; padding: 0;
  background: var(--panel); color: var(--ink);
  width: min(520px, calc(100vw - 32px)); max-height: calc(100vh - 48px);
  box-shadow: var(--shadow);
}
dialog.wide { width: min(840px, calc(100vw - 32px)); }
dialog[open] { display: flex; flex-direction: column; }
dialog::backdrop { background: rgba(14, 20, 32, .4); }
.dlg { padding: 22px 24px 18px; overflow: auto; }
.dlg h2 { margin: 0 0 6px; font-size: 19px; font-weight: 600; letter-spacing: -.01em; }
.dlg h3 { margin: 18px 0 6px; font-size: 14px; font-weight: 600; }
.dlg .lead { margin: 4px 0 0; color: var(--ink-2); }
.dlg-actions { display: flex; gap: 8px; align-items: center; padding: 13px 24px; border-top: 1px solid var(--rule-2); background: var(--sunk); border-radius: 0 0 12px 12px; flex-wrap: wrap; }
.spacer { flex: 1; }
.field { display: block; margin-top: 14px; font-size: 13px; color: var(--ink-2); }
.field input, .field textarea {
  display: block; width: 100%; margin-top: 5px; padding: 8px 10px;
  border: 1px solid var(--rule); border-radius: 8px; background: var(--sunk); color: var(--ink); font-size: 14px;
}
.field textarea { resize: vertical; min-height: 56px; }
.field-error { margin: 6px 0 0; color: var(--remove); font-size: 13px; }
fieldset { border: 0; padding: 0; margin: 14px 0 0; }
legend { font-size: 13px; color: var(--ink-2); padding: 0; margin-bottom: 6px; }
.radio, .check { display: flex; gap: 8px; align-items: center; margin: 4px 0; cursor: pointer; }
.ops { list-style: none; margin: 0; padding: 0; }
.op { display: flex; gap: 10px; padding: 5px 0; align-items: baseline; }
.sign { width: 14px; font-weight: 700; text-align: center; flex: none; }
.op.add .sign { color: var(--add); }
.op.edit .sign { color: var(--gold); }
.op.del .sign { color: var(--remove); }
.ptable { border: 1px solid var(--rule-2); border-radius: 8px; max-height: 320px; overflow: auto; }
.prow { display: grid; grid-template-columns: minmax(160px, 38%) 1fr; gap: 12px; padding: 7px 12px; border-bottom: 1px solid var(--rule-2); font-size: 13px; }
.prow:last-child { border-bottom: 0; }
.prepo { overflow-wrap: anywhere; font-weight: 500; }
.pchg { display: flex; flex-wrap: wrap; gap: 5px 10px; }
.pc.add { color: var(--add); }
.pc.del { color: var(--remove); }
.pc.keep { color: var(--ink-3); }
.notes { margin: 14px 0 0; padding: 0 0 0 18px; color: var(--ink-2); font-size: 13px; }
.errors { margin-top: 12px; padding: 10px 14px; border-radius: 8px; background: color-mix(in srgb, var(--remove) 10%, var(--panel)); color: var(--ink); }
.errors ul { margin: 6px 0 0; padding-left: 18px; }
.foot { margin-top: 16px; font-size: 12.5px; color: var(--ink-2); }
.bar { height: 8px; border-radius: 4px; background: var(--rule-2); overflow: hidden; margin: 16px 0 8px; }
.bar i { display: block; height: 100%; background: var(--gold); width: 0; transition: width .35s ease; }
.bar.indet i { width: 30%; animation: slide 1.4s ease-in-out infinite; }
@keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(340%); } }
details { margin-top: 12px; }
details pre { max-height: 220px; overflow: auto; background: var(--sunk); border-radius: 8px; padding: 10px 12px; font-size: 12px; white-space: pre-wrap; }
.errtext { white-space: pre-wrap; background: var(--sunk); border-radius: 8px; padding: 10px 12px; font-size: 13px; }
.snaps { margin-top: 12px; border: 1px solid var(--rule-2); border-radius: 8px; }
.snap { display: grid; grid-template-columns: 92px 1fr auto; gap: 12px; padding: 9px 12px; border-bottom: 1px solid var(--rule-2); align-items: center; font-size: 13px; }
.snap:last-child { border-bottom: 0; }
.snap .kind { color: var(--ink-2); }
.warn { margin-top: 10px; padding: 10px 14px; border-radius: 8px; border: 1px solid color-mix(in srgb, var(--remove) 40%, var(--rule)); font-size: 13px; }
.warn b { color: var(--remove); }
.setup { margin: 8px 0 0; padding: 8px 10px; background: var(--panel); border-radius: 6px; font-size: 12.5px; white-space: pre-wrap; overflow-wrap: anywhere; user-select: all; }

/* ---------- toast & drag ---------- */
.toast {
  position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 60;
  background: var(--ink); color: var(--panel); padding: 9px 10px 9px 16px; border-radius: 9px;
  display: flex; gap: 14px; align-items: center; box-shadow: var(--shadow); max-width: calc(100vw - 32px);
}
.toast button { border: 0; background: transparent; color: var(--gold-soft); font-weight: 600; padding: 3px 8px; }
@media (prefers-color-scheme: dark) { .toast button { color: var(--gold); } }
.ghostdrag { position: fixed; top: -200px; left: -200px; padding: 6px 11px; border-radius: 7px; background: var(--ink); color: var(--panel); font-size: 13px; }

/* ---------- AI assistant drawer ---------- */
.app.chat-open { grid-template-columns: 300px minmax(0, 1fr) var(--chat-w, 400px); }
.chat { display: none; }
.app.chat-open .chat { display: flex; flex-direction: column; min-height: 0; background: var(--panel); border-left: 1px solid var(--rule); position: relative; }
.chat-resize { position: absolute; left: -5px; top: 0; bottom: 0; width: 10px; cursor: col-resize; z-index: 6; touch-action: none; }
.chat-resize::after { content: ""; position: absolute; left: 4px; top: 0; bottom: 0; width: 2px; background: transparent; transition: background .15s; }
.chat-resize:hover::after, .chat-resize:focus-visible::after, .chat-resize.dragging::after { background: var(--focus); }
.chat-resize:focus-visible { outline: none; }
body.resizing { cursor: col-resize; user-select: none; }
.chat-head { display: flex; align-items: center; gap: 8px; padding: 12px 14px 10px; border-bottom: 1px solid var(--rule-2); }
.chat-head h2 { margin: 0; font-size: 15px; font-weight: 600; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chat-head select { max-width: 150px; font-size: 12.5px; padding: 4px 6px; }
.chat-note { padding: 8px 14px 0; font-size: 12.5px; color: var(--ink-2); }
.chat-note:empty { display: none; }
.chat-note .warn { margin-top: 0; padding: 7px 10px; font-size: 12px; }
.chat-log { flex: 1; overflow: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
.msg { max-width: 92%; padding: 8px 11px; border-radius: 10px; font-size: 13.5px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.me { align-self: flex-end; background: var(--sel); }
.msg.ai { align-self: flex-start; background: var(--sunk); white-space: normal; width: 92%; }
.md p { margin: 0 0 6px; }
.md p:last-child, .md ul:last-child, .md ol:last-child { margin-bottom: 0; }
.md ul, .md ol { margin: 2px 0 6px; padding-left: 20px; font-size: 13.5px; }
.md li { margin: 2px 0; }
.md code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; background: var(--panel); padding: 0 4px; border-radius: 4px; }
.changes { margin-top: 8px; border: 1px solid var(--rule-2); border-radius: 8px; background: var(--panel); overflow: hidden; }
.changes-head { padding: 6px 10px; font-size: 12px; color: var(--ink-2); border-bottom: 1px solid var(--rule-2); }
.change { border-bottom: 1px solid var(--rule-2); }
.change:last-child { border-bottom: 0; }
.change summary { display: flex; align-items: center; gap: 8px; padding: 6px 10px; cursor: pointer; list-style: none; font-size: 13px; }
.change summary::-webkit-details-marker { display: none; }
.change summary::before { content: "▸"; color: var(--ink-3); font-size: 10px; width: 8px; flex: none; }
.change[open] summary::before { content: "▾"; }
.change .star { width: 13px; height: 13px; flex: none; }
.change .cname { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink); text-align: left; }

.tagc.add { color: var(--add); background: color-mix(in srgb, var(--add) 13%, var(--panel)); }
.tagc.del { color: var(--remove); background: color-mix(in srgb, var(--remove) 13%, var(--panel)); }
.tagc.meta { color: var(--ink-2); background: var(--sunk); }
.change ul { margin: 0; padding: 0 10px 8px 34px; font-size: 12.5px; color: var(--ink-2); overflow-wrap: anywhere; }
.change li { margin: 1px 0; }
.change li.add::marker { content: "+  "; color: var(--add); font-weight: 700; }
.change li.del::marker { content: "−  "; color: var(--remove); font-weight: 700; }
.msg.err { color: var(--remove); }
.msg.pending { color: var(--ink-2); }
.msg ul { margin: 6px 0 0; padding-left: 18px; font-size: 12.5px; white-space: normal; }
.msg ul.done { color: var(--ink); }
.msg ul.skipped { color: var(--ink-2); }
.msg .turn-foot { margin-top: 6px; display: flex; gap: 10px; align-items: center; font-size: 12px; color: var(--ink-3); white-space: normal; }
.chat-empty { color: var(--ink-2); font-size: 13px; }
.chat-empty ul { padding-left: 18px; margin: 6px 0 10px; }
.chat-empty li { margin: 3px 0; }
.chat-foot { border-top: 1px solid var(--rule-2); padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 8px; }
.chat-foot textarea { width: 100%; resize: none; min-height: 64px; padding: 8px 10px; border: 1px solid var(--rule); border-radius: 8px; background: var(--sunk); color: var(--ink); font-size: 14px; }
.chat-row { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--ink-3); }
.chat-row .keys { white-space: nowrap; }
.chat-divider { display: flex; align-items: center; gap: 8px; color: var(--ink-3); font-size: 12px; margin: 2px 0; white-space: nowrap; }
.chat-divider::before, .chat-divider::after { content: ""; flex: 1; border-top: 1px dashed var(--rule); }
.msg.old { opacity: .62; }
.hist-bar { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); }
.hist-bar b { color: var(--ink); }
.hist-list { display: flex; flex-direction: column; gap: 8px; }
.hist-item { text-align: left; padding: 9px 11px; border: 1px solid var(--rule-2); border-radius: 8px; background: var(--panel); display: flex; flex-direction: column; gap: 3px; font-size: 13px; }
.hist-item:hover { border-color: var(--ink-3); }
.hist-item .when { font-weight: 600; }
.hist-item .sum, .hist-item .first { color: var(--ink-2); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chat.viewing-history .chat-foot { display: none; }
#chatHistory.on { background: var(--sunk); }
#btnChat.on { background: var(--sunk); border-color: var(--ink-3); }
@media (max-width: 1180px) {
  .app.chat-open { grid-template-columns: 300px minmax(0, 1fr); }
  .app.chat-open .chat { position: fixed; right: 0; top: 0; bottom: 0; width: min(var(--chat-w, 400px), 100vw); z-index: 45; box-shadow: var(--shadow); }
}

/* ---------- narrow ---------- */
@media (max-width: 980px) {
  .row { grid-template-columns: 24px minmax(0, 1fr); }
  .row .meta { grid-column: 2; flex-direction: row; gap: 12px; padding: 0; }
  .row .chips { grid-column: 2; }
}
@media (max-width: 760px) {
  .app, .app.chat-open { grid-template-columns: 1fr; grid-template-rows: auto auto minmax(0, 1fr); }
  .side { max-height: 34vh; border-bottom: 1px solid var(--rule); padding: 10px 12px; }
  .main { border-left: 0; }
  .view-head, .toolbar, .listhead, .row { padding-left: 16px; padding-right: 16px; }
  .top { flex-wrap: wrap; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before { animation: none !important; transition: none !important; }

const STAR = "M12 2.6l2.83 6.08 6.67.72-4.98 4.5 1.4 6.56L12 17.1l-5.92 3.36 1.4-6.56-4.98-4.5 6.67-.72z";
const SVGNS = "http://www.w3.org/2000/svg";

  return t || "";
})();

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "style") el.style.cssText = v;
    else if (k === "dataset") Object.assign(el.dataset, v);
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, "");
    else el.setAttribute(k, v);
  }
  for (const c of kids.flat(Infinity)) {
    if (c == null || c === false) continue;
    el.append(c instanceof Node ? c : String(c));
  }
  return el;
}

  if (color) s.style.setProperty("--c", color);

  p.setAttribute("d", STAR);

function t(key, ...args) {
  const pair = STR[key];
  if (!pair) { console.warn("missing string:", key); return key; }
  const v = pair[LANG === "zh" ? 0 : 1];
  return typeof v === "function" ? v(...args) : v;
}
// Fill the static parts of the page: data-i18n (text), -title, -placeholder, -aria (aria-label).
function applyStatic() {
  document.documentElement.lang = LANG === "zh" ? "zh-CN" : "en";
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  for (const [attr, key] of [["title", "i18nTitle"], ["placeholder", "i18nPlaceholder"], ["aria-label", "i18nAria"]]) {
    document.querySelectorAll(`[data-${key.replace(/[A-Z]/g, c => "-" + c.toLowerCase())}]`)
      .forEach(el => el.setAttribute(attr, t(el.dataset[key])));
  }
  $("#uiLang").value = LANG;
}
// The macOS app (if the page runs inside it) switches its menus to the same language.
function tellApp() {
  try { window.webkit.messageHandlers.starshelf.postMessage({ lang: LANG }); } catch (_) {}
}
applyStatic();
tellApp();

const isTyping = () => { const a = document.activeElement; return a && (a.tagName === "INPUT" || a.tagName === "TEXTAREA" || a.tagName === "SELECT") && a.type !== "checkbox"; };

async function api(method, path, body) {
  const opts = { method, headers: { "X-Session": TOKEN, "X-Lang": LANG } };
  if (body !== undefined) { opts.headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(body); }
  const res = await fetch(path, opts);
  let data = null;
  try { data = await res.json(); } catch (_) {}
  if (!res.ok) throw new Error((data && data.error) || t("httpFail", res.status));
  return data;
}

  view: "all", q: "", lang: "", sort: "starred", changedOnly: false,

function setBaseline(b) {
  S.login = b.login;
  S.fetchedAt = b.fetched_at;
  S.repos = new Map(b.repos.map(r => [r.id, r]));
  S.base = new Map(b.lists.map(l => [l.id, { name: l.name, description: l.description || "", private: !!l.private, items: new Set(l.items) }]));
  S.lists = b.lists.map(l => ({ key: l.id, id: l.id, name: l.name, description: l.description || "", private: !!l.private, items: new Set(l.items), deleted: false, color: null }));
  assignColors(S.lists);
  S.newSeq = 1; S.undo = []; S.redo = []; S.sel.clear(); S.anchor = null; S.unstar = new Set();
  if (!SPECIAL.has(S.view) && !findList(S.view)) S.view = "all";
  fillLanguages();
  if (CHAT.fetchedAt) { rolloverChat(); renderChat(); }   // not on first load: loadChat() handles that
}
const serializeLists = () => S.lists.map(l => ({ key: l.key, id: l.id, name: l.name, description: l.description, private: l.private, deleted: l.deleted, color: l.color, items: [...l.items] }));
function loadLists(arr) {
  S.lists = arr.map(l => ({ ...l, items: new Set(l.items.filter(id => S.repos.has(id))) }));
  if (!SPECIAL.has(S.view) && !findList(S.view)) S.view = "all";
}
const SPECIAL = new Set(["all", "none", "unstar"]);
function loadUnstar(ids) { S.unstar = new Set((ids || []).filter(id => S.repos.has(id) && S.repos.get(id).starred)); }
// Undo/redo/autosave snapshots: the lists plus the repos marked to unstar.
const snapState = () => JSON.stringify({ lists: serializeLists(), unstar: [...S.unstar] });
function loadState(json) {
  const o = JSON.parse(json);
  if (Array.isArray(o)) { loadLists(o); S.unstar = new Set(); } else { loadLists(o.lists); loadUnstar(o.unstar); }
}
const findList = key => S.lists.find(l => l.key === key);
const alive = () => S.lists.filter(l => !l.deleted);
const colorOf = l => PALETTE[(l.color || 0) % PALETTE.length];

// A list keeps its colour across reloads, renames and deletions of other lists (remembered in
// this browser by list id and by name; a new list gets the least-used colour).
const COLOR_KEY = "sl-colors";
function colorMap() { try { return JSON.parse(localStorage.getItem(COLOR_KEY) || "{}") || {}; } catch (_) { return {}; } }
function saveColorMap(m) { try { localStorage.setItem(COLOR_KEY, JSON.stringify(m)); } catch (_) {} }
function leastUsed(lists) {
  const used = new Map();
  lists.forEach(l => l.color != null && used.set(l.color, (used.get(l.color) || 0) + 1));
  let best = 0, bestN = Infinity;
  for (let i = 0; i < PALETTE.length; i++) { const n = used.get(i) || 0; if (n < bestN) { best = i; bestN = n; } }
  return best;
}
function assignColors(lists) {
  const m = colorMap();
  for (const l of lists) {
    const c = (l.id && m["id:" + l.id] != null) ? m["id:" + l.id] : m["name:" + l.name];
    l.color = Number.isInteger(c) && c < PALETTE.length ? c : null;
  }
  for (const l of lists) if (l.color == null) l.color = leastUsed(lists);
  lists.forEach(l => rememberColor(l, m));
  saveColorMap(m);
}
function rememberColor(l, m) {
  const map = m || colorMap();
  if (l.id) map["id:" + l.id] = l.color;
  map["name:" + l.name] = l.color;
  if (!m) saveColorMap(map);
}
const nextColor = () => leastUsed(S.lists.filter(l => !l.deleted));
const inAny = id => S.lists.some(l => !l.deleted && l.items.has(id));
const unlistedIds = () => [...S.repos.values()].filter(r => r.starred && !inAny(r.id) && !S.unstar.has(r.id)).map(r => r.id);
const viewList = () => SPECIAL.has(S.view) ? null : findList(S.view);

function repoDiff(id) {
  const added = [], removed = [];
  for (const l of S.lists) {
    const base = S.base.get(l.key);
    const was = !!(base && base.items.has(id));
    const now = !l.deleted && l.items.has(id);
    if (l.deleted) continue;           // deleting a list is counted as a list change
    if (now && !was) added.push(l.key);
    if (was && !now) removed.push(l.key);
  }
  return { added, removed, changed: added.length + removed.length > 0 || S.unstar.has(id) };
}
function listEdited(l) {
  const b = S.base.get(l.key);
  return !!b && !l.deleted && (b.name !== l.name || b.description !== l.description || b.private !== l.private);
}
function listTouched(l) {
  if (!l.id || l.deleted || listEdited(l)) return true;
  const b = S.base.get(l.key);
  if (b.items.size !== l.items.size) return true;
  for (const id of l.items) if (!b.items.has(id)) return true;
  return false;
}
function summary() {
  let creates = 0, deletes = 0, edits = 0, members = 0;
  for (const l of S.lists) {
    if (!l.id) { if (!l.deleted) creates++; continue; }
    if (l.deleted) deletes++;
    else if (listEdited(l)) edits++;
  }
  for (const id of S.repos.keys()) if (repoDiff(id).changed) members++;
  return { creates, deletes, edits, members, unstars: S.unstar.size, total: creates + deletes + edits + members };
}

// ------------------------------------------------------------------ edits
function commit(fn) {
  const before = snapState();
  fn();
  const after = snapState();
  if (before === after) return false;
  S.undo.push(before);
  if (S.undo.length > 200) S.undo.shift();
  S.redo = [];
  afterEdit();
  return true;
}
function afterEdit() { render(); scheduleSave(); if (CHAT.open) renderChat(); }
function undo() {
  if (!S.undo.length) return;
  S.redo.push(snapState());
  loadState(S.undo.pop());
  afterEdit(); toast(t("undone"), false);
}
function redo() {
  if (!S.redo.length) return;
  S.undo.push(snapState());
  loadState(S.redo.pop());
  afterEdit(); toast(t("redone"), false);
}
const addRaw = (key, ids) => { const l = findList(key); ids.forEach(id => { l.items.add(id); S.unstar.delete(id); }); };
const removeRaw = (key, ids) => { const l = findList(key); ids.forEach(id => l.items.delete(id)); };
const clearRaw = ids => alive().forEach(l => ids.forEach(id => l.items.delete(id)));
const plural = ids => ids.length === 1 ? (S.repos.get(ids[0]) || {}).full_name : t("nRepos", ids.length);

function doAdd(key, ids) {
  const l = findList(key);
  if (commit(() => addRaw(key, ids))) toast(t("added", plural(ids), l.name));
  else toast(t("alreadyIn", plural(ids), l.name), false);
}
function doRemove(key, ids) {
  const l = findList(key);
  if (commit(() => removeRaw(key, ids))) { toast(t("removed", plural(ids), l.name)); }
}
function doMove(from, to, ids) {
  const a = findList(from), b = findList(to);
  if (commit(() => { removeRaw(from, ids); addRaw(to, ids); })) toast(t("moved", plural(ids), a.name, b.name));
}
function doClear(ids) {
  if (commit(() => clearRaw(ids))) toast(t("cleared", plural(ids)));
}
// Unstar is a draft mark: the repo leaves every list now, and its star goes only when applied.
function doUnstar(ids) {
  ids = ids.filter(id => S.repos.get(id).starred && !S.unstar.has(id));
  if (!ids.length) return;
  if (commit(() => { clearRaw(ids); ids.forEach(id => S.unstar.add(id)); })) {
    toast(t("markedUnstar", plural(ids)));
  }
}
function doKeepStar(ids) {
  ids = ids.filter(id => S.unstar.has(id));
  if (!ids.length) return;
  commit(() => ids.forEach(id => {
    S.unstar.delete(id);
    for (const l of alive()) { const b = S.base.get(l.key); if (b && b.items.has(id)) l.items.add(id); }
  }));
  toast(t("keepsStar", plural(ids)));
}

// ------------------------------------------------------------------ saving
// Every edit is saved right away; saves never overlap, and the newest state always wins.
const SAVE = { busy: false, again: false };
function draftBody() {
  const dirty = summary().total > 0 || S.lists.some(l => !l.id);
  return { dirty, body: { draft: dirty ? { fetched_at: S.fetchedAt, newSeq: S.newSeq, lists: serializeLists(), unstar: [...S.unstar] } : null } };
}
// The note next to the buttons; kept as a string key so a language switch can redraw it.
const SAVE_NOTE = { key: "", arg: "" };
function saveNote(key, arg) {
  Object.assign(SAVE_NOTE, { key: key || "", arg: arg || "" });
  $("#saveState").textContent = key ? t(key, arg) : "";
}
function scheduleSave() {
  saveNote("saving");
  if (SAVE.busy) { SAVE.again = true; return; }
  saveDraft();
}
async function saveDraft() {
  SAVE.busy = true; SAVE.again = false;
  const { dirty, body } = draftBody();
  try {
    await api("PUT", "/api/draft", body);
    if (!SAVE.again) saveNote(dirty ? "saved" : "");
  } catch (err) {
    saveNote("saveFailed", err.message);
  } finally {
    SAVE.busy = false;
    if (SAVE.again) saveDraft();
  }
}
function flushOnExit() {
  if (!SAVE.busy && !SAVE.again) return;
  try {
    fetch("/api/draft", { method: "PUT", keepalive: true, body: JSON.stringify(draftBody().body),
      headers: { "X-Session": TOKEN, "X-Lang": LANG, "Content-Type": "application/json" } });
  } catch (_) {}
}
window.addEventListener("pagehide", flushOnExit);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") flushOnExit(); });

// ------------------------------------------------------------------ rendering
function render() { renderTop(); renderSide(); renderMain(); }

function renderTop() {
  const s = summary();
  $("#login").textContent = "@" + S.login;
  $("#synced").textContent = t("readAt", fmtTime(S.fetchedAt));
  $("#btnUndo").disabled = !S.undo.length;
  $("#btnRedo").disabled = !S.redo.length;
  $("#btnDiscard").disabled = s.total === 0;
  const running = S.job && S.job.status === "running";
  const refresh = $("#btnRefresh");
  refresh.disabled = s.total > 0 || running;
  refresh.title = s.total > 0 ? t("refreshBlocked") : t("refreshTitle");
  const review = $("#btnReview");
  review.replaceChildren();
  if (running) {
    review.disabled = false;
    review.append(S.job.total ? t("applyingStep", S.job.step, S.job.total) : t("applying"));
  } else {
    review.disabled = s.total === 0;
    review.append(t("preview"), h("span", { class: "count", id: "changeCount" }, s.total));
  }
}

function renderSide() {
  $("#nAll").textContent = [...S.repos.values()].filter(r => r.starred).length;
  $("#nNone").textContent = unlistedIds().length;
  if (!S.unstar.size && S.view === "unstar") S.view = "all";
  $("#vUnstar").hidden = !S.unstar.size;
  $("#nUnstar").textContent = S.unstar.size;
  document.querySelectorAll(".vbtn").forEach(b => b.classList.toggle("on", b.dataset.view === S.view));
  const ul = $("#lists");
  ul.replaceChildren();
  if (!S.lists.length) ul.append(h("li", { class: "empty-side" }, t("noLists")));
  for (const l of S.lists) {
    const isNew = !l.id, renamed = l.id && S.base.get(l.key).name !== l.name;
    const li = h("li", {
      class: "litem" + (S.view === l.key ? " on" : "") + (l.deleted ? " doomed" : ""),
      dataset: { key: l.key }, style: `--c:${colorOf(l)}`,
    },
      h("button", { class: "lbtn", dataset: { act: "view", key: l.key }, title: l.description || l.name },
        star(colorOf(l)),
        h("span", { class: "lname" }, l.name),
        isNew && !l.deleted ? h("span", { class: "badge" }, t("badgeNew")) : null,
        renamed && !l.deleted ? h("span", { class: "badge", title: t("oldName", S.base.get(l.key).name) }, t("badgeRenamed")) : null,
        l.deleted ? h("span", { class: "badge del" }, t("badgeDelete")) : null,
        !isNew && !l.deleted && listTouched(l) && !renamed ? h("span", { class: "flag", title: t("hasChanges") }) : null,
        h("span", { class: "n" }, l.items.size)),
      l.deleted
        ? h("button", { class: "ghost edit", dataset: { act: "undelete", key: l.key } }, t("restore"))
        : h("button", { class: "ghost edit", dataset: { act: "edit", key: l.key }, "aria-label": t("editNamed", l.name) }, t("edit")));
    ul.append(li);
  }
}

function viewIds() {
  const repos = [...S.repos.values()];
  if (S.view === "all") return repos.filter(r => r.starred || inAny(r.id)).map(r => r.id);
  if (S.view === "none") return unlistedIds();
  if (S.view === "unstar") return [...S.unstar];
  const l = viewList();
  if (!l) return [];
  const ids = new Set(l.items);
  const b = S.base.get(l.key);
  if (b && !l.deleted) b.items.forEach(id => S.repos.has(id) && ids.add(id));
  return [...ids];
}

function filtered() {
  const words = S.q.toLowerCase().split(/\s+/).filter(Boolean);
  let ids = viewIds().filter(id => {
    const r = S.repos.get(id);
    if (S.lang && (r.language || OTHER) !== S.lang) return false;
    if (S.changedOnly && !repoDiff(id).changed) return false;
    if (!words.length) return true;
    const hay = (r.full_name + " " + (r.description || "")).toLowerCase();
    return words.every(w => hay.includes(w));
  });
  const R = id => S.repos.get(id);
  const by = {
    starred: (a, b) => (R(b).starred_at || "").localeCompare(R(a).starred_at || ""),
    name: (a, b) => R(a).full_name.localeCompare(R(b).full_name, "en", { sensitivity: "base" }),
    stars: (a, b) => (R(b).stars || 0) - (R(a).stars || 0),
    pushed: (a, b) => (R(b).pushed_at || "").localeCompare(R(a).pushed_at || ""),
  }[S.sort];
  return ids.sort(by);
}

function renderMain() {
  const l = viewList();
  const title = $("#viewTitle"), desc = $("#viewDesc"), banner = $("#banner");
  title.replaceChildren(); banner.hidden = true; banner.replaceChildren();
  $("#btnEditList").hidden = !l || l.deleted;
  if (S.view === "all") {
    title.append(t("allStars"));
    desc.textContent = t("allDesc");
  } else if (S.view === "none") {
    title.append(t("noList"));
    desc.textContent = t("noneDesc");
  } else if (S.view === "unstar") {
    title.append(t("toUnstar"));
    desc.textContent = t("unstarDesc");
    banner.hidden = false;
    banner.append(h("span", { id: "unstarPending" }, h("b", {}, t("notYet")), t("unstarPending", S.unstar.size)),
      h("button", { onclick: () => openReview(null) }, t("preview")));
  } else if (l) {
    title.append(star(colorOf(l)), l.name);
    if (l.private) title.append(h("span", { class: "tag" }, t("private")));
    desc.textContent = l.description || t("noDesc");
    if (l.deleted) {
      banner.hidden = false;
      banner.append(h("span", {}, t("listDoomed")),
        h("button", { onclick: () => undelete(l.key) }, t("restoreList")));
    }
  }
  const ids = filtered();
  S.visible = ids;
  for (const id of [...S.sel]) if (!ids.includes(id)) S.sel.delete(id);
  const rows = $("#rows");
  rows.replaceChildren();
  if (!ids.length) {
    rows.append(emptyState());
  } else {
    const frag = document.createDocumentFragment();
    for (const id of ids) frag.append(rowEl(id, l));
    rows.append(frag);
  }
  renderSelection();
}

function emptyState() {
  let msg;
  if (S.q || S.lang || S.changedOnly) msg = t("emptyFiltered");
  else if (S.view === "none") msg = t("emptyNone");
  else if (S.view === "unstar") msg = t("emptyUnstar");
  else if (S.view === "all") msg = t("emptyAll");
  else msg = t("emptyList");
  return h("div", { class: "empty" }, star(), h("p", {}, msg));
}

function rowEl(id, l) {
  const r = S.repos.get(id);
  const d = repoDiff(id);
  const gone = l && !l.deleted && !l.items.has(id);
  const [owner, ...rest] = r.full_name.split("/");
  const leaving = S.unstar.has(id);
  const row = h("div", {
    class: "row" + (d.changed ? " changed" : "") + (S.sel.has(id) ? " sel" : "") + (gone ? " gone" : "") + (leaving ? " unstarring" : ""),
    dataset: { id }, draggable: "true",
  },
    h("input", { type: "checkbox", dataset: { act: "pick" }, "aria-label": t("selectRepo", r.full_name), checked: S.sel.has(id) }),
    h("div", { class: "what" },
      h("a", { class: "name", href: r.url, target: "_blank", rel: "noopener noreferrer", draggable: "false" },
        h("span", { class: "owner" }, owner + "/"), h("span", { class: "repo" }, rest.join("/"))),
      r.archived ? h("span", { class: "tag" }, t("archived")) : null,
      !r.starred ? h("span", { class: "tag" }, t("notStarred")) : null,
      leaving ? h("span", { class: "tag del" }, t("willUnstar")) : null,
      r.description ? h("p", { class: "desc", title: r.description }, r.description) : null,
      gone && !leaving ? h("p", { class: "gone-note" }, t("removedFrom", l.name),
        h("button", { class: "link", dataset: { act: "restore-here" } }, t("undo"))) : null,
      leaving ? h("p", { class: "unstar-note" }, t("unstarNote"),
        h("button", { class: "link", dataset: { act: "keep-star" } }, t("keepStar"))) : null),
    h("div", { class: "meta" },
      h("span", { class: "stars" }, "★ " + fmtNum(r.stars)),
      r.language ? h("span", {}, r.language) : null,
      r.pushed_at ? h("span", { title: t("lastPush") }, t("updated", r.pushed_at.slice(0, 10))) : null),
    chipsEl(id));
  return row;
}

function chipsEl(id) {
  const box = h("div", { class: "chips" });
  for (const l of S.lists) {
    const b = S.base.get(l.key);
    const was = !!(b && b.items.has(id));
    const now = !l.deleted && l.items.has(id);
    const style = `--c:${colorOf(l)}`;
    if (now) {
      box.append(h("span", { class: "chip" + (was ? "" : " added"), style, title: was ? l.name : t("chipAdded", l.name) },
        h("button", { class: "cn", dataset: { act: "goto", key: l.key } }, l.name),
        h("button", { class: "x", dataset: { act: "chip-remove", key: l.key }, "aria-label": t("removeFrom", l.name) }, "×")));
    } else if (was && l.deleted) {
      box.append(h("span", { class: "chip doomed", style, title: t("chipDoomed", l.name) }, l.name));
    } else if (was) {
      box.append(h("button", { class: "chip removed", style, dataset: { act: "chip-restore", key: l.key }, title: t("chipRemoved", l.name) }, l.name));
    }
  }
  box.append(h("button", { class: "chip-add", dataset: { act: "pick-lists" }, "aria-label": t("addOrRemove"), title: t("addOrRemove") }, "+"));
  return box;
}

function renderSelection() {
  const n = S.sel.size, vis = S.visible;
  document.querySelectorAll("#rows .row").forEach(row => {
    const on = S.sel.has(row.dataset.id);
    row.classList.toggle("sel", on);
    const cb = row.querySelector("input[type=checkbox]");
    if (cb) cb.checked = on;
  });
  const all = $("#selAll");
  all.checked = n > 0 && n === vis.length;
  all.indeterminate = n > 0 && n < vis.length;
  all.disabled = !vis.length;
  $("#listhead").classList.toggle("has-sel", n > 0);
  $("#acts").hidden = n === 0;
  const total = viewIds().length;
  $("#countLabel").textContent = n ? t("nSelected", n) : (vis.length === total ? t("nRepos", total) : t("showing", vis.length, total));
  const l = viewList();
  $("#bMove").hidden = !l || l.deleted;
  $("#bRemove").hidden = !l || l.deleted;
  if (l) $("#bRemove").textContent = t("removeFrom", l.name);
  $("#bClear").hidden = ![...S.sel].some(inAny);
  $("#bUnstar").hidden = ![...S.sel].some(id => S.repos.get(id).starred && !S.unstar.has(id));
  $("#bKeep").hidden = ![...S.sel].some(id => S.unstar.has(id));
}

const OTHER = "\u0000other";   // filter value for repos without a language
function fillLanguages() {
  const counts = new Map();
  for (const r of S.repos.values()) { const k = r.language || OTHER; counts.set(k, (counts.get(k) || 0) + 1); }
  const sel = $("#lang");
  sel.replaceChildren(h("option", { value: "" }, t("allLangs")),
    [...counts.entries()].sort((a, b) => b[1] - a[1]).map(([k, n]) => h("option", { value: k }, t("langCount", k === OTHER ? t("otherLang") : k, n))));
  if (S.lang && !counts.has(S.lang)) S.lang = "";
  sel.value = S.lang;
}

function setView(v) {
  S.view = v; S.sel.clear(); S.anchor = null;
  closePopover();
  render();
  $("#main").scrollTop = 0;
}

// ------------------------------------------------------------------ toast
let toastTimer = null;
function toast(msg, withUndo = true) {
  $("#toastMsg").textContent = msg;
  $("#toastUndo").hidden = !withUndo;
  $("#toast").hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { $("#toast").hidden = true; }, withUndo ? 5000 : 2200);
}

// ------------------------------------------------------------------ popover (list picker)
let pop = null;
function closePopover() {
  if (!pop) return;
  $("#popover").hidden = true;
  $("#popover").replaceChildren();
  const anchor = pop.anchor; pop = null;
  if (anchor && document.contains(anchor)) anchor.focus({ preventScroll: true });
}
function openPicker(anchor, cfg) {
  // cfg: {mode: "toggle"|"add"|"move", ids, title}
  closePopover();
  pop = { anchor, ...cfg };
  const box = $("#popover");
  const filter = h("input", { type: "search", placeholder: t("findList"), "aria-label": t("findList") });
  const opts = h("div", { class: "opts", role: "listbox" });
  const fill = () => {
    opts.replaceChildren();
    const q = filter.value.trim().toLowerCase();
    const lists = alive().filter(l => !(cfg.mode === "move" && l.key === S.view) && (!q || l.name.toLowerCase().includes(q)));
    if (!lists.length) opts.append(h("p", { class: "empty-side" }, q ? t("noMatch") : t("noOther")));
    for (const l of lists) {
      const inside = cfg.ids.every(id => l.items.has(id));
      opts.append(h("button", { class: "opt", dataset: { key: l.key }, role: "option", "aria-selected": cfg.mode === "toggle" ? String(inside) : null },
        star(colorOf(l)), h("span", { class: "lname" }, l.name),
        cfg.mode === "toggle" ? h("span", { class: "on" }, inside ? "✓" : "") : h("span", { class: "n" }, l.items.size)));
    }
  };
  filter.addEventListener("input", fill);
  filter.addEventListener("keydown", e => {
    if (e.key === "Enter") { const first = opts.querySelector(".opt"); if (first) { e.preventDefault(); first.click(); } }
    if (e.key === "ArrowDown") { const first = opts.querySelector(".opt"); if (first) { e.preventDefault(); first.focus(); } }
  });
  opts.addEventListener("keydown", e => {
    const items = [...opts.querySelectorAll(".opt")], i = items.indexOf(document.activeElement);
    if (e.key === "ArrowDown" && i < items.length - 1) { e.preventDefault(); items[i + 1].focus(); }
    if (e.key === "ArrowUp") { e.preventDefault(); (i > 0 ? items[i - 1] : filter).focus(); }
  });
  opts.addEventListener("click", e => {
    const b = e.target.closest(".opt"); if (!b) return;
    const key = b.dataset.key, l = findList(key);
    if (cfg.mode === "toggle") {
      const id = cfg.ids[0];
      if (l.items.has(id)) doRemove(key, [id]); else doAdd(key, [id]);
      fill();
      const again = opts.querySelector(`.opt[data-key="${CSS.escape(key)}"]`); if (again) again.focus();
    } else if (cfg.mode === "add") {
      closePopover(); doAdd(key, cfg.ids);
    } else {
      const from = S.view; closePopover(); doMove(from, key, cfg.ids); S.sel.clear(); renderSelection();
    }
  });
  const create = h("button", { class: "opt", onclick: () => {
    const c = { ...cfg }; closePopover();
    openListDialog(null, { ids: c.ids, moveFrom: c.mode === "move" ? S.view : null });
  } }, h("span", { class: "sign" }, "+"), t("newListDots"));
  const one = cfg.mode === "toggle" ? cfg.ids[0] : null;
  const starBtn = one && S.repos.get(one).starred ? (S.unstar.has(one)
    ? h("button", { class: "opt", onclick: () => { closePopover(); doKeepStar([one]); } }, h("span", { class: "sign" }, "★"), t("keepStar"))
    : h("button", { class: "opt danger", onclick: () => { closePopover(); doUnstar([one]); } }, h("span", { class: "sign" }, "✕"), t("unstarDots")))
    : null;
  box.replaceChildren(h("div", { class: "ph" }, cfg.title), filter, opts, h("div", { class: "pf" }, create, starBtn));
  fill();
  box.hidden = false;
  const r = anchor.getBoundingClientRect(), W = box.offsetWidth, H = box.offsetHeight;
  let left = Math.min(Math.max(8, r.left), window.innerWidth - W - 8);
  let top = r.bottom + 6;
  if (top + H > window.innerHeight - 8) top = Math.max(8, r.top - H - 6);
  box.style.left = left + "px"; box.style.top = top + "px";
  filter.focus();
}

// ------------------------------------------------------------------ list dialog
const LD = { key: null, ids: [], moveFrom: null, confirmDelete: false };
function openListDialog(key, opts = {}) {

$("#listForm").addEventListener("submit", e => {
  e.preventDefault();
  const name = $("#ldName").value.trim();
  const description = $("#ldDesc").value.trim();
  const priv = document.querySelector("input[name=vis]:checked").value === "private";
  const err = $("#ldErr");
  if (!name) { err.textContent = t("nameRequired"); err.hidden = false; $("#ldName").focus(); return; }

  if (clash) { err.textContent = t("nameTaken", clash.name); err.hidden = false; $("#ldName").focus(); return; }
  if (LD.key) {
    const l = findList(LD.key);

      S.lists.push({ key, id: null, name, description, private: priv, items: new Set(ids), deleted: false, color });
      if (from && ids.length) removeRaw(from, ids);

$("#ldCancel").addEventListener("click", () => $("#listDialog").close());

function deleteList(key) {

function renderPlan(p) {
  const restore = S.review.restore, body = $("#rvBody"), acts = $("#rvActions"), dlg = $("#reviewDialog");

  let unstarOk = null;
  if (p.unstars.length) {
    body.append(h("h3", { id: "rvUnstarHead" }, t("hUnstar", p.unstars.length)),
      h("div", { class: "ptable", id: "rvUnstar" }, p.unstars.map(n => h("div", { class: "prow" }, h("span", { class: "prepo" }, n),
        h("span", { class: "pchg" }, h("span", { class: "pc del" }, "− star"))))));
    unstarOk = h("input", { type: "checkbox", id: "rvUnstarOk" });

      h("span", {}, t("confirmUnstar", p.unstars.length))));

  const notes = [];
  if (p.emptied) notes.push(t("noteEmptied", p.emptied));

  let delFirst = null;
  if (!restore && p.creates.length && p.deletes.length) {

  const go = h("button", { class: "primary", disabled: p.errors.length > 0 || !!unstarOk }, restore ? t("restoreThis") : t("applyGitHub"));
  if (unstarOk) unstarOk.addEventListener("change", () => { go.disabled = p.errors.length > 0 || !unstarOk.checked; });
  go.addEventListener("click", () => startApply(p, delFirst && delFirst.checked, !!(unstarOk && unstarOk.checked)));
  acts.replaceChildren(h("span", { class: "spacer" }), h("button", { onclick: () => dlg.close() }, t("cancel")), go);

async function startApply(plan, deleteFirst, confirmUnstar) {
  const restore = S.review.restore;
  const body = restore ? { restore: restore.file, fingerprint: plan.fingerprint }
    : { lists: layoutLists(), unstar: [...S.unstar], fingerprint: plan.fingerprint, delete_first: !!deleteFirst,
        confirm_unstar: !!confirmUnstar };
  try {
    S.job = await api("POST", "/api/apply", body);
    renderProgress(S.job);
    startPolling();
  } catch (err) {
    $("#rvBody").replaceChildren(h("h2", {}, t("cantStart")), h("p", { class: "errtext" }, err.message));
    $("#rvActions").replaceChildren(h("span", { class: "spacer" }), h("button", { onclick: () => $("#reviewDialog").close() }, t("close")));
  }
}

function startPolling() {
  clearInterval(S.poll);
  S.poll = setInterval(async () => {
    try {
      const j = await api("GET", "/api/job");
      S.job = j;
      renderTop();
      if ($("#reviewDialog").open) renderProgress(j);
      if (j.status !== "running") { clearInterval(S.poll); S.poll = null; await jobEnded(j); }
    } catch (_) { /* keep polling; the server may be busy */ }
  }, 800);
}

function renderProgress(j) {
  const restore = j.kind === "restore";
  if (j.status !== "running") return;
  const pct = j.total ? Math.round(100 * j.step / j.total) : 0;
  const bar = h("div", { class: "bar" + (j.total ? "" : " indet") }, h("i", { style: j.total ? `width:${pct}%` : "" }));
  $("#rvBody").replaceChildren(
    h("h2", {}, restore ? t("restoring") : t("applyingGH")),
    h("p", { class: "lead" }, j.phase || t("preparing")),
    bar,
    j.total ? h("p", { class: "small muted" }, t("stepOf", j.step, j.total, j.current)) : null,
    h("details", {}, h("summary", {}, t("detailLog")), h("pre", {}, (j.log || []).join("\n"))));
  $("#rvActions").replaceChildren(h("span", { class: "small muted" }, t("dontClose")));
}

async function jobEnded(j) {
  const dlg = $("#reviewDialog");
  const restore = j.kind === "restore";
  if (j.status === "done") {
    const keepName = (viewList() || {}).name;
    try {
      const d = await api("GET", "/api/state");
      setBaseline(d.baseline);
      if (keepName) { const l = S.lists.find(x => x.name === keepName); S.view = l ? l.key : "all"; }

    } catch (err) { toast(t("reloadFailed", err.message), false); }

    $("#rvBody").replaceChildren(
      h("h2", {}, restore ? t("restoredT") : t("appliedT")),

      j.backup ? h("p", { class: "foot" }, t("backupBefore", j.backup)) : null);
    $("#rvActions").replaceChildren(h("span", { class: "spacer" }), h("button", { class: "primary", onclick: () => dlg.close() }, t("done")));
  } else {
    render();
    if (!dlg.open) dlg.showModal();
    $("#rvBody").replaceChildren(
      h("h2", {}, t("notAllDone")),
      h("p", { class: "errtext" }, j.error || t("unknownError")),
      j.backup ? h("p", { class: "foot" }, t("backupBeforeShort", j.backup)) : null,
      h("details", {}, h("summary", {}, t("detailLog")), h("pre", {}, (j.log || []).join("\n"))));

    $("#rvActions").replaceChildren(h("span", { class: "spacer" }), h("button", { onclick: () => dlg.close() }, t("close")), again);
  }

// While GitHub is being written to, the progress dialog cannot be dismissed (so the draft
// cannot be edited half-way through an apply).
const jobRunning = () => !!(S.job && S.job.status === "running");
$("#reviewDialog").addEventListener("cancel", e => { if (jobRunning()) e.preventDefault(); });
$("#reviewDialog").addEventListener("close", () => {
  if (jobRunning()) setTimeout(() => { const d = $("#reviewDialog"); if (!d.open) d.showModal(); renderProgress(S.job); }, 0);
});

// ------------------------------------------------------------------ AI backend choice (used by the assistant)
// AI.status comes from GET /api/chat: the available backends (Claude Code / Codex) and the default.
const AI = { status: null, form: { backend: null } };
const BACKEND_KEY = "sl-ai-backend";
function rememberedBackend() { try { return localStorage.getItem(BACKEND_KEY); } catch (_) { return null; } }
function rememberBackend(id) { try { localStorage.setItem(BACKEND_KEY, id); } catch (_) {} }

// ------------------------------------------------------------------ AI assistant (chat drawer)
// Each turn sends the conversation and the current draft; the AI answers with a reply and a list
// of operations, which are applied to the draft as one undoable edit. Nothing here writes to GitHub.
// The panel shows the current conversation; 「新对话」 inserts a divider, and only messages after the last
// divider are sent to the AI. When the GitHub state is read again (after an apply or 「重新读取」) the whole
// conversation is archived into a read-only history (newest 10, kept in this browser only).
const CHAT_KEY = "sl-chat", CHAT_HIST_KEY = "sl-chat-history", CHAT_HIST_MAX = 10, CHAT_CONTEXT = 12;
const CHAT = { open: false, turns: [], fetchedAt: null, waiting: null, waitingLabel: "", poll: null,
               view: "current", archived: [], confirmClear: false };
const chatKeep = t => ({ role: t.role, text: t.text, ops: t.ops, changes: t.changes, warnings: t.warnings,
                         label: t.label, undone: t.undone, at: t.at });
const isMessage = t => t.role === "user" || t.role === "ai";
const nowIso = () => new Date().toISOString();
function loadChat() {
  try {
    const o = JSON.parse(localStorage.getItem(CHAT_KEY) || "null");
    CHAT.turns = o && Array.isArray(o.turns) ? o.turns.map(chatKeep) : [];
    CHAT.fetchedAt = o ? o.fetchedAt || null : null;
  } catch (_) { CHAT.turns = []; CHAT.fetchedAt = null; }
  try {
    const list = JSON.parse(localStorage.getItem(CHAT_HIST_KEY) || "[]");
    CHAT.archived = Array.isArray(list) ? list : [];
  } catch (_) { CHAT.archived = []; }
  rolloverChat();
}
function saveChat() {
  try { localStorage.setItem(CHAT_KEY, JSON.stringify({ fetchedAt: S.fetchedAt, turns: CHAT.turns.slice(-60).map(chatKeep) })); } catch (_) {}
}
function saveHistory() {
  let list = CHAT.archived.slice(0, CHAT_HIST_MAX);
  for (;;) {  // if storage is full, drop the oldest archived conversations
    try { localStorage.setItem(CHAT_HIST_KEY, JSON.stringify(list)); break; }
    catch (_) { if (!list.length) break; list = list.slice(0, -1); }
  }
  CHAT.archived = list;
}
function archiveChat() {
  const turns = CHAT.turns.map(chatKeep), msgs = turns.filter(isMessage);
  if (!msgs.length) return;
  CHAT.archived.unshift({ id: Date.now(), start: msgs[0].at || null, end: msgs[msgs.length - 1].at || null, turns });
  saveHistory();
}
// The draft and the AI's view of it start over whenever GitHub is read again: archive the old talk.
function rolloverChat() {
  if (CHAT.fetchedAt && CHAT.fetchedAt !== S.fetchedAt) {
    archiveChat();
    CHAT.turns = [];
  }
  CHAT.fetchedAt = S.fetchedAt;
  saveChat();
}
const lastDivider = () => CHAT.turns.map(t => t.role).lastIndexOf("divider");
const currentSegment = () => CHAT.turns.slice(lastDivider() + 1);
function newConversation() {
  const last = CHAT.turns[CHAT.turns.length - 1];
  if (CHAT.waiting || !CHAT.turns.some(isMessage) || (last && last.role === "divider")) return;
  CHAT.turns.push({ role: "divider", at: nowIso() });
  CHAT.view = "current";
  saveChat(); renderChat();
  $("#chatInput").focus();
}

async function toggleChat(open) {
  CHAT.open = open === undefined ? !CHAT.open : open;
  $("#app").classList.toggle("chat-open", CHAT.open);
  $("#btnChat").classList.toggle("on", CHAT.open);
  if (!CHAT.open) return;
  renderChat();
  $("#chatInput").focus();
  if (!AI.status) {
    try { const j = await api("GET", "/api/chat"); if (j.ai) AI.status = j.ai; } catch (_) {}
    renderChat();
  }
}

function chatBackend() {
  const backends = (AI.status && AI.status.backends) || [];
  if (!backends.some(b => b.id === AI.form.backend)) {
    const saved = rememberedBackend();
    const pick = backends.find(b => b.id === saved && b.available) || backends.find(b => b.id === (AI.status || {}).default);
    AI.form.backend = pick ? pick.id : null;
  }
  return { backends, st: backends.find(b => b.id === AI.form.backend) || null };
}

function renderChat() {
  if (!CHAT.open) return;
  const { backends, st } = chatBackend();
  const sel = $("#chatBackend");
  sel.replaceChildren(...backends.map(b => h("option", { value: b.id, selected: b.id === AI.form.backend }, b.label + (b.available ? "" : t("unavailable")))));
  sel.hidden = !backends.length;
  const note = $("#chatNote");
  note.replaceChildren();
  if (!AI.status) note.append(t("checkingAI"));
  else if (!st || !st.available) note.append(h("div", { class: "warn" }, h("b", {}, t("aiNotReady")), (st && st.reason) || t("noAIOption"),
    st && (st.setup || []).length ? h("pre", { class: "setup" }, st.setup.join("\n")) : null));
  else if (st.warning) note.append(h("div", { class: "warn" }, h("b", {}, t("securityNote")), st.warning));
  const log = $("#chatLog");
  log.replaceChildren();
  const inHistory = CHAT.view !== "current";
  $("#chat").classList.toggle("viewing-history", inHistory);
  $("#chatHistory").classList.toggle("on", inHistory);
  $("#chatNew").disabled = !!CHAT.waiting || !CHAT.turns.some(isMessage) || (CHAT.turns[CHAT.turns.length - 1] || {}).role === "divider";
  if (inHistory) { renderHistory(log); return; }
  if (!CHAT.turns.length && !CHAT.waiting) {
    log.append(h("div", { class: "chat-empty" }, t("chatIntro"),
      h("ul", {}, t("chatExamples").map(e => h("li", {}, h("button", { class: "link", onclick: () => { $("#chatInput").value = e; $("#chatInput").focus(); } }, e)))),
      t("chatDraftOnly"),
      CHAT.archived.length ? h("p", {}, t("chatArchived")) : null));
  }
  const cut = lastDivider();
  CHAT.turns.forEach((turn, i) => log.append(turn.role === "divider"
    ? h("div", { class: "chat-divider" }, t("divider", fmtTime(turn.at)))
    : turnEl(turn, { old: i < cut })));
  if (CHAT.waiting) log.append(h("div", { class: "msg ai pending", id: "chatPending" }, t("thinking", CHAT.waitingLabel || "AI")));
  log.scrollTop = log.scrollHeight;
  const seg = currentSegment().filter(isMessage).length;
  $("#chatContext").textContent = !CHAT.turns.some(isMessage) ? ""
    : seg === 0 ? t("ctxNew")
    : t("ctxRecent", Math.min(seg, CHAT_CONTEXT)) + (seg > CHAT_CONTEXT ? t("ctxOlder", seg - CHAT_CONTEXT) : "");
  $("#chatSend").disabled = !!CHAT.waiting || !st || !st.available;
}

function historySummary(a) {
  const msgs = a.turns.filter(isMessage);
  let added = 0, removed = 0, unstar = 0;

// A tiny, safe Markdown subset for AI replies: paragraphs, "- " / "1. " lists, **bold**, `code`.
// Everything becomes DOM text nodes; nothing is parsed as HTML.
function inlineMd(text) {
  const out = [], re = /\*\*([^*]+)\*\*|`([^`]+)`/g;
  let last = 0, m;
  while ((m = re.exec(text))) {
    if (m.index > last) out.push(text.slice(last, m.index));
    out.push(m[1] !== undefined ? h("strong", {}, m[1]) : h("code", {}, m[2]));
    last = re.lastIndex;
  }
  if (last < text.length) out.push(text.slice(last));
  return out;
}
function mdEl(text) {
  const box = h("div", { class: "md" });
  let list = null, para = null;
  for (const raw of String(text || "").split("\n")) {
    const line = raw.trimEnd();
    const item = line.match(/^\s*(?:[-*•]|(\d+)[.)])\s+(.*)$/);
    if (item) {
      const tag = item[1] ? "OL" : "UL";
      if (!list || list.tagName !== tag) { list = h(tag.toLowerCase(), {}); box.append(list); }
      list.append(h("li", {}, inlineMd(item[2])));
      para = null;
      continue;
    }
    list = null;
    if (!line.trim()) { para = null; continue; }
    if (para) para.append(h("br"), ...inlineMd(line));
    else { para = h("p", {}, inlineMd(line)); box.append(para); }
  }
  return box;
}

// What one AI answer changed in the draft, grouped per list (from the draft before/after it).
function draftChanges(beforeJson, afterJson) {
  const a = JSON.parse(beforeJson), b = JSON.parse(afterJson);
  const alive = arr => new Map(arr.filter(l => !l.deleted).map(l => [l.key, l]));
  const A = alive(a.lists), B = alive(b.lists);
  const nameOf = id => (S.repos.get(id) || {}).full_name || id;
  const groups = [];
  for (const [key, l] of B) {
    const o = A.get(key), was = new Set(o ? o.items : []), now = new Set(l.items);
    const g = { key, name: l.name, color: l.color, created: !o, renamedFrom: o && o.name !== l.name ? o.name : null,
                deleted: false, added: l.items.filter(id => !was.has(id)).map(nameOf),
                removed: o ? o.items.filter(id => !now.has(id)).map(nameOf) : [] };
    if (g.created || g.renamedFrom || g.added.length || g.removed.length) groups.push(g);
  }
  for (const [key, o] of A) if (!B.has(key)) groups.push({ key, name: o.name, color: o.color, created: false, renamedFrom: null, deleted: true, added: [], removed: [] });
  const ua = new Set(a.unstar || []), ub = new Set(b.unstar || []);
  return { groups, unstar: [...ub].filter(id => !ua.has(id)).map(nameOf), keep: [...ua].filter(id => !ub.has(id)).map(nameOf) };
}

async function sendChat() {

  const text = input.value.trim();
  if (!text || CHAT.waiting) return;
  const history = currentSegment().filter(isMessage).slice(-CHAT_CONTEXT).map(turn => ({
    role: turn.role === "user" ? "user" : "assistant",
    text: turn.role === "ai" && (turn.ops || []).length ? `${turn.text}\n${t("draftNote", turn.ops, turn.undone)}` : turn.text,
  }));
  const body = { message: text, history, backend: AI.form.backend, unstar: [...S.unstar],
    lists: alive().map(l => ({ key: l.key, name: l.name.trim(), description: l.description, items: [...l.items] })) };
  CHAT.view = "current";
  CHAT.turns.push({ role: "user", text, at: nowIso() });

function pollChat() {
  clearInterval(CHAT.poll);
  CHAT.poll = setInterval(async () => {
    let j;
    try { j = await api("GET", "/api/chat"); } catch (_) { return; }
    if (j.id !== CHAT.waiting) { clearInterval(CHAT.poll); return; }
    if (j.status === "running") {
      const el = $("#chatPending");
      if (el) el.textContent = t("thinkingSec", j.label || "AI", Math.round(j.elapsed));
      return;
    }
    clearInterval(CHAT.poll); CHAT.waiting = null;
    if (j.ai) AI.status = j.ai;
    if (j.status === "done") finishChat(j.result, j.label);
    else { CHAT.turns.push({ role: "err", text: j.error || t("unknownError"), at: nowIso() }); saveChat(); renderChat(); }
  }, 1000);
}

// Apply one answer's operations to the draft (runs inside commit()); returns what was done.
function applyChatOps(ops) {
  const done = [], skipped = [], made = {};
  const nameOf = id => (S.repos.get(id) || {}).full_name || id;
  const few = ids => t("few", ids.slice(0, 3).map(nameOf), ids.length);
  const target = ref => {
    const key = ref && ref.startsWith("new:") ? made[ref] : ref;
    const l = key ? findList(key) : null;
    return l && !l.deleted ? l : null;
  };
  const clash = (name, except) => alive().find(x => x !== except && x.name.toLowerCase() === name.toLowerCase());
  for (const o of ops) {
    const ids = (o.repos || []).filter(id => S.repos.has(id));
    if (o.op === "create_list") {
      const twin = clash(o.name);
      if (twin) { made[o.list] = twin.key; skipped.push(t("opsDup", twin.name)); continue; }
      const key = `new-${S.newSeq++}`;
      S.lists.push({ key, id: null, name: o.name, description: o.description || "", private: false, items: new Set(), deleted: false, color: nextColor() });
      made[o.list] = key;
      done.push(t("opsCreated", o.name));
      continue;
    }
    if (o.op === "unstar") {
      const ok = ids.filter(id => S.repos.get(id).starred && !S.unstar.has(id));
      if (ok.length) { clearRaw(ok); ok.forEach(id => S.unstar.add(id)); done.push(t("opsUnstar", few(ok))); }
      continue;
    }
    if (o.op === "keep_star") {
      const ok = ids.filter(id => S.unstar.has(id));
      ok.forEach(id => {
        S.unstar.delete(id);
        for (const l of alive()) { const b = S.base.get(l.key); if (b && b.items.has(id)) l.items.add(id); }
      });
      if (ok.length) done.push(t("opsKeep", few(ok)));
      continue;
    }
    const l = target(o.list);
    if (!l) { skipped.push(t("opsGone")); continue; }
    if (o.op === "rename_list") {
      if (clash(o.name, l)) { skipped.push(t("opsRenameClash", o.name)); continue; }
      const old = l.name;
      l.name = o.name;
      if (o.description) l.description = o.description;
      if (old !== o.name) done.push(t("opsRenamed", old, o.name));
    } else if (o.op === "delete_list") {
      if (!l.id) S.lists.splice(S.lists.indexOf(l), 1); else l.deleted = true;
      done.push(t("opsDeleted", l.name));
    } else if (o.op === "add") {
      const n = ids.filter(id => !l.items.has(id));
      n.forEach(id => { l.items.add(id); S.unstar.delete(id); });
      if (n.length) done.push(t("opsAdded", few(n), l.name));
    } else if (o.op === "remove") {
      const n = ids.filter(id => l.items.has(id));
      n.forEach(id => l.items.delete(id));
      if (n.length) done.push(t("opsRemoved", few(n), l.name));
    } else if (o.op === "move") {
      const to = target(o.to);
      if (!to) { skipped.push(t("opsToGone")); continue; }
      ids.forEach(id => { l.items.delete(id); to.items.add(id); S.unstar.delete(id); });
      if (ids.length) done.push(t("opsMoved", few(ids), l.name, to.name));
    }
  }
  return { done, skipped };
}

function finishChat(res, label) {
  const before = snapState();
  let out = { done: [], skipped: [] };
  const changed = commit(() => { out = applyChatOps(res.operations || []); });
  S.lists.filter(l => !l.id && !l.deleted).forEach(l => rememberColor(l));
  const after = snapState();
  CHAT.turns.push({ role: "ai", label, at: nowIso(), text: res.reply || (changed ? t("aiChanged") : t("aiNoChange")),
    ops: changed ? out.done : [], changes: changed ? draftChanges(before, after) : null,
    warnings: [...(res.warnings || []), ...out.skipped], before: changed ? before : null, after: changed ? after : null });
  saveChat(); renderChat();
  if (changed) toast(t("aiToast", out.done.length));
}

// The drawer's width: drag its left edge (or focus it and use ←/→); double-click resets. Remembered per browser.
const CHAT_W_KEY = "sl-chat-width", CHAT_W_DEFAULT = 400;
function setChatWidth(w, save) {
  const max = Math.max(320, Math.min(900, window.innerWidth - 420));
  w = Math.round(Math.min(max, Math.max(300, w)));
  $("#app").style.setProperty("--chat-w", w + "px");
  CHAT.width = w;
  const handle = $("#chatResize");
  handle.setAttribute("aria-valuenow", String(w));
  handle.setAttribute("aria-valuemin", "300");
  handle.setAttribute("aria-valuemax", String(max));
  if (save) { try { localStorage.setItem(CHAT_W_KEY, String(w)); } catch (_) {} }
}
(() => {
  let saved = CHAT_W_DEFAULT;
  try { saved = parseInt(localStorage.getItem(CHAT_W_KEY), 10) || CHAT_W_DEFAULT; } catch (_) {}
  setChatWidth(saved, false);
  const handle = $("#chatResize");
  handle.addEventListener("pointerdown", e => {
    e.preventDefault();
    handle.setPointerCapture(e.pointerId);
    handle.classList.add("dragging"); document.body.classList.add("resizing");
  });
  handle.addEventListener("pointermove", e => {
    if (handle.hasPointerCapture(e.pointerId)) setChatWidth(window.innerWidth - e.clientX, false);
  });
  const stop = e => {
    if (!handle.hasPointerCapture(e.pointerId)) return;
    handle.releasePointerCapture(e.pointerId);
    handle.classList.remove("dragging"); document.body.classList.remove("resizing");
    setChatWidth(CHAT.width, true);
  };
  handle.addEventListener("pointerup", stop);
  handle.addEventListener("pointercancel", stop);
  handle.addEventListener("dblclick", () => setChatWidth(CHAT_W_DEFAULT, true));
  handle.addEventListener("keydown", e => {
    if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
      e.preventDefault();
      setChatWidth(CHAT.width + (e.key === "ArrowLeft" ? 24 : -24), true);
    }
  });
  window.addEventListener("resize", () => setChatWidth(CHAT.width, false));
})();

  if (name === "pick") { toggleSel(id, e.shiftKey); return; }
  if (name === "goto") { setView(act.dataset.key); return; }
  if (name === "chip-remove") { doRemove(act.dataset.key, [id]); return; }
  if (name === "chip-restore") { doAdd(act.dataset.key, [id]); return; }
  if (name === "restore-here") { doAdd(S.view, [id]); return; }
  if (name === "keep-star") { doKeepStar([id]); return; }
  if (name === "pick-lists") { openPicker(act, { mode: "toggle", ids: [id], title: t("whichLists") }); return; }
  if (e.target.closest("button, input, select, label")) return;
  if (window.getSelection && String(window.getSelection())) return;   // user is selecting text
  toggleSel(id, e.shiftKey);
});

// drag & drop: rows onto lists
$("#rows").addEventListener("dragstart", e => {
  const row = e.target.closest(".row"); if (!row) return;
  const id = row.dataset.id;
  const ids = S.sel.has(id) ? [...S.sel] : [id];
  S.drag = { ids };
  e.dataTransfer.effectAllowed = "copyMove";
  e.dataTransfer.setData("text/plain", ids.map(x => S.repos.get(x).full_name).join("\n"));
  const g = $("#ghostdrag"); g.textContent = plural(ids);
  e.dataTransfer.setDragImage(g, 14, 14);
  $("#dragHint").hidden = false;
});
$("#rows").addEventListener("dragend", () => {
  S.drag = null; $("#dragHint").hidden = true;
  document.querySelectorAll(".drop").forEach(x => x.classList.remove("drop"));
});
function dropTarget(e) {
  const li = e.target.closest(".litem");
  if (li && !findList(li.dataset.key).deleted) return li;
  const v = e.target.closest(".vbtn[data-view=none]");
  return v || null;
}
const side = $(".side");
side.addEventListener("dragover", e => {
  if (!S.drag) return;
  const t = dropTarget(e);
  document.querySelectorAll(".drop").forEach(x => x !== t && x.classList.remove("drop"));
  if (!t) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = (e.altKey && viewList()) || t.classList.contains("vbtn") ? "move" : "copy";
  t.classList.add("drop");
});
side.addEventListener("drop", e => {
  if (!S.drag) return;
  const t = dropTarget(e); if (!t) return;
  e.preventDefault();
  const ids = S.drag.ids;
  t.classList.remove("drop");
  if (t.classList.contains("vbtn")) { doClear(ids); return; }
  const key = t.dataset.key, cur = viewList();
  if (e.altKey && cur && !cur.deleted && cur.key !== key) { S.sel.clear(); doMove(cur.key, key, ids); }
  else doAdd(key, ids);
});

document.addEventListener("keydown", e => {
  const mod = e.metaKey || e.ctrlKey;
  if (e.key === "Escape") {
    if (pop) { e.preventDefault(); closePopover(); return; }
    if (!document.querySelector("dialog[open]") && S.sel.size) { S.sel.clear(); renderSelection(); }
    return;
  }
  if (document.querySelector("dialog[open]")) return;
  if (isTyping()) return;
  if (e.key === "/" && !mod) { e.preventDefault(); $("#q").focus(); $("#q").select(); }
  else if (mod && e.key.toLowerCase() === "z" && !e.shiftKey) { e.preventDefault(); undo(); }
  else if ((mod && e.key.toLowerCase() === "z" && e.shiftKey) || (e.ctrlKey && e.key.toLowerCase() === "y")) { e.preventDefault(); redo(); }
  else if (mod && e.key.toLowerCase() === "a") { e.preventDefault(); S.visible.forEach(id => S.sel.add(id)); renderSelection(); }
});

// ------------------------------------------------------------------ boot
async function boot() {
  const msg = $("#bootMsg"), retry = $("#bootRetry");
  if (!TOKEN) {
    msg.textContent = t("needLink");
    document.querySelector("#boot .star").classList.remove("spin");
    return;
  }
  retry.hidden = true;
  msg.textContent = t("loading");
  try {
    const d = await api("GET", "/api/state");
    setBaseline(d.baseline);
    if (d.draft && Array.isArray(d.draft.lists)) {
      loadLists(d.draft.lists);
      loadUnstar(d.draft.unstar);
      S.newSeq = d.draft.newSeq || S.lists.length + 1;
    }
    loadChat();
    $("#boot").hidden = true;
    $("#app").hidden = false;
    render();
    if (d.draft && summary().total) { saveNote("saved"); toast(t("restoredDraft", summary().total), false); }
    if (d.job && d.job.status === "running") {
      S.job = d.job; S.review = { restore: null };
      renderTop(); $("#reviewDialog").showModal(); renderProgress(d.job); startPolling();
    }
  } catch (err) {
    msg.textContent = t("readFailed", err.message);
    document.querySelector("#boot .star").classList.remove("spin");
    retry.hidden = false;
  }
}
$("#bootRetry").addEventListener("click", boot);

// Switching the language redraws everything; stored chat messages keep the language they were written in.
$("#uiLang").addEventListener("change", e => {
  const v = e.target.value;
  if (v !== "zh" && v !== "en") return;
  LANG = v;
  try { localStorage.setItem(LANG_KEY, v); } catch (_) {}
  tellApp();
  applyStatic();
  if ($("#app").hidden) return;
  closePopover();
  fillLanguages();
  render();
  saveNote(SAVE_NOTE.key, SAVE_NOTE.arg);
  AI.status = null;             // its reasons and notes come from the server in the old language
  if (CHAT.open) toggleChat(true); else renderChat();
});
boot();
})();
</script>
